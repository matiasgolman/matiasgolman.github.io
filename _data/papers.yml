working:
  - title: "Artificial intelligence and personality traits"
    sub: "Evidence from online job vacancies"
    authors: "with María García-Vega"
    where: "GEP Research Paper 2026/06, University of Nottingham"
    year: 2026
    pdf: "/assets/pdf/golman-ai-personality-traits.pdf"
    text: >-
      When a firm starts hiring for AI skills, does it also start asking for a different kind of
      person? We read 11.7 million UK job adverts to find out, and the answer is yes. Firms moving
      into AI ask for openness to experience across all their vacancies, not only the technical
      ones.
    abstract: >-
      Using text analysis of 11.7 million UK online job postings from 2017 to 2022, drawn from a
      near-universe dataset of online vacancies, we construct measures of Big Five personality
      traits and AI-related skill requirements from job descriptions. At the vacancy level,
      positions requiring AI-related skills are significantly more likely to demand openness to
      experience and less likely to demand the remaining four traits, after controlling for firm,
      occupation, location and time fixed effects. This pattern is distinct from the profile of
      postings requiring general computer skills, which suggests the association with openness is
      specific to AI knowledge rather than to broader digital requirements. At the firm level,
      staggered difference-in-differences estimates show that when firms expand AI-related hiring,
      their demand for openness rises across all postings, including non-AI vacancies within
      occupation groups. The results are consistent with firms that seek to integrate AI knowledge
      valuing creative workers who can adapt to new tools and approaches, and extending this
      preference beyond the roles that directly involve AI.

  - title: "The value of personality"
    sub: "The wage penalty paradox in the UK"
    where: "University of Nottingham"
    year: 2026
    pdf: "/assets/pdf/golman-value-of-personality.pdf"
    text: >-
      Job adverts that ask for personality traits pay 4.6% less on average. If those traits are
      penalised, why advertise for them at all? I test four candidate explanations against 11.7
      million UK postings, and none of them accounts for the whole gap on its own.
    abstract: >-
      Jobs that mention personality traits offer 4.6% lower wages on average, which raises a
      paradox. Why advertise for traits that are penalised? Using 11.7 million UK job postings
      (2017 to 2022), I test four explanations, namely correlation with low-pay job
      characteristics, compensating differentials, linguistic intensity, and demographic
      targeting. Occupation fixed effects absorb the most, but significant penalties remain.
      Penalties are larger in high-skill occupations, smaller in female-dominated roles, and rise
      sharply with the intensity of the language used. Employers appear to use trait language for
      several purposes at once rather than one.

  - title: "The effectiveness of formalisation policies in Latin America"
    sub: "A meta-analysis of 79 impact evaluations"
    year: 2026
    authors: "with Verónica Escudero and Elva López-Mourelo"
    where: "International Labour Organization"
    pdf: "/assets/pdf/golman-formalisation-meta-analysis.pdf"
    text: >-
      Thirty years of attempts to pull Latin American workers into formal employment, gathered in
      one place and weighed against each other. Most of them work. Which ones work best, and for
      how long, turns out to depend on what you are trying to move.
    abstract: >-
      The first comprehensive meta-analysis of formalisation policies in Latin America, covering
      79 impact evaluations, 527 estimates and interventions from 1990 to 2020, including
      Spanish-language studies and unpublished government reports that earlier reviews missed.
      Formalisation policies mostly work, and adverse effects are rare (5.1% of estimates),
      although publication bias substantially reduces effect sizes once corrected. Active labour
      market policies, information campaigns and labour inspections raise formality. Social
      protection programmes with activation components produce the largest earnings effects but
      barely move formality at all. Benefits strengthen over time, and multi-component
      interventions outperform single-component ones.

