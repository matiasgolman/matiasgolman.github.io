working:
  - title: "The effect of AI adoption on the demand for personality traits"
    sub: "Evidence from 11.7 million UK online job vacancies"
    year: 2026
    pdf: "/assets/pdf/golman-ai-personality-traits.pdf"
    abstract: >-
      Using text retrieval methods on 11.7 million online job vacancies (2017–2022), I find that
      72% of vacancies require at least one Big Five personality trait. Extraversion is the most
      common (44%), followed by Conscientiousness (34%) and Openness (30%). After accounting for
      occupational change, personality demands are mostly stable over time. Vacancies requiring AI
      skills are 7.2 percentage points more likely to demand Openness, and firms increase their
      demand for Openness by 3.6 percentage points across all subsequent hiring after they adopt AI
      for the first time — suggesting that as firms adopt AI they increasingly value creativity and
      adaptability, well beyond the AI roles themselves.

  - title: "The value of personality"
    sub: "The wage penalty paradox in the UK"
    year: 2026
    pdf: "/assets/pdf/golman-value-of-personality.pdf"
    abstract: >-
      Jobs that mention personality traits offer 4.6% lower wages on average, which raises a
      paradox: why advertise for traits that are penalised? Using 11.7 million UK job postings
      (2017–2022), I test four explanations — correlation with low-pay job characteristics,
      compensating differentials, linguistic intensity, and demographic targeting. Occupation fixed
      effects absorb the most, but significant penalties remain. Penalties are larger in high-skill
      occupations, smaller in female-dominated roles, and rise sharply with the intensity of the
      language used. Employers appear to use trait language for several purposes at once rather
      than one.

  - title: "The effectiveness of formalisation policies in Latin America"
    sub: "A meta-analysis of 79 impact evaluations"
    year: 2026
    authors: "with Verónica Escudero and Elva López-Mourelo (ILO)"
    pdf: "/assets/pdf/golman-formalisation-meta-analysis.pdf"
    abstract: >-
      The first comprehensive meta-analysis of formalisation policies in Latin America: 79 impact
      evaluations, 527 estimates, interventions from 1990 to 2020, including Spanish-language
      studies and unpublished government reports that earlier reviews missed. Formalisation
      policies mostly work, and adverse effects are rare (5.1% of estimates) — but publication bias
      substantially reduces effect sizes once corrected. Active labour market policies, information
      campaigns and labour inspections raise formality; social protection programmes with
      activation components produce the largest earnings effects but barely move formality at all.
      Benefits strengthen over time, and multi-component interventions outperform single-component
      ones.

