policy:
  - title: "Labour market informality in Costa Rica"
    year: "2025–26"
    org: "International Labour Organization"
    text: >-
      A diagnostic of informal employment for the national formalisation framework: a review of a
      decade of studies and legal instruments, an analysis of how informal employment has moved
      across demographic and territorial lines using household survey microdata, and econometric
      models of its structural determinants. Recommendations aligned with ILO Recommendation 204
      and the FORLAC 2.0 strategy.
  - title: "Future of work, emerging sectors and the potential for transition to formality"
    authors: "with Christoph Ernst"
    year: 2022
    org: "International Labour Organization"
    pdf: "/assets/pdf/ilo-future-of-work-formality.pdf"
    text: >-
      Where new formal jobs could come from in the green economy, the platform economy and the care
      economy — and what it would take for them to be decent ones.
