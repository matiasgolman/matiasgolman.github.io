policy:
  - title: "Labour market informality in Costa Rica"
    year: "2025–26"
    org: "International Labour Organization, forthcoming"
    text: >-
      A diagnostic of informal employment, written to feed the national formalisation framework.
      It reviews a decade of studies and legal instruments, tracks how informal employment has
      moved across demographic and territorial lines using household survey microdata, and models
      its structural determinants. The recommendations follow ILO Recommendation 204 and the
      FORLAC 2.0 strategy.
