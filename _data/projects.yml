- name: "Latin America Informality Dashboard"
  url: "/dashboard/"
  shot: "/assets/img/shot-dashboard.jpg"
  shot_alt: "Screenshot of the informality dashboard comparing informality rates in Argentina, Costa Rica, Mexico and Brazil"
  blurb: >-
    An interactive tool that turns household survey microdata into something a policy officer can
    actually use. It covers informal employment in Argentina (from 2003), Mexico
    (from 2005), Costa Rica (from 2010) and Brazil (from 2012), broken down by sector, region, sex and age, one country at a time or
    side by side.
  note: "Data from the national household surveys: INDEC's EPH (Argentina), IBGE's PNAD Contínua (Brazil), INEC's ECE (Costa Rica) and INEGI's ENOE (Mexico)."

- name: "Araucaria Spotter"
  url: "https://araucaria-spotter.vercel.app/"
  external: true
  shot: "/assets/img/shot-araucaria.jpg"
  shot_alt: "Screenshot of the Araucaria Spotter app showing a map with recorded trees"
  blurb: >-
    A community map of the Araucaria araucana, the monkey puzzle tree, growing outside its native
    range in the Andes. It started as a game of spotting them on the street, and turned into an app
    so that other people could add the ones they find. The map shows how far the species has
    travelled.
  note: "More than 500 trees recorded around the world so far, and more coming in every day. Web app now, on Google Play soon."
