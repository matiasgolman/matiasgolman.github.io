- name: "Panel de informalidad en América Latina"
  url: "/es/panel/"
  shot: "/assets/img/shot-dashboard.jpg"
  shot_alt: "Captura del panel de informalidad, con la comparación de las tasas de Argentina, Costa Rica, México y Brasil"
  blurb: >-
    Una herramienta interactiva que convierte microdatos de encuestas de hogares en algo que un equipo de política pública puede usar de verdad. Cubre el empleo informal
    en Argentina (desde 2003), México (desde 2005), Costa Rica (desde 2010) y Brasil (desde 2012), abierto por sector, región, sexo y edad, de
    a un país o lado a lado.
  note: "Datos de las encuestas de hogares nacionales: la EPH del INDEC (Argentina), la PNAD Contínua del IBGE (Brasil), la ECE del INEC (Costa Rica) y la ENOE del INEGI (México)."

- name: "Araucaria Spotter"
  url: "https://araucaria-spotter.vercel.app/"
  external: true
  shot: "/assets/img/shot-araucaria.jpg"
  shot_alt: "Captura de la app Araucaria Spotter, con un mapa de árboles registrados"
  blurb: >-
    Un mapa comunitario de la Araucaria araucana, el pehuén, creciendo fuera de su rango nativo en
    los Andes. Empezó como un juego de buscarlas por la calle y terminó en una app para que otros
    puedan sumar las que encuentran. El mapa muestra hasta dónde viajó la especie.
  note: "Más de 500 árboles registrados en el mundo hasta ahora, y entran más todos los días. Hoy es app web, y pronto en Google Play."
