    authors: "con Christoph Ernst"
    year: 2022
    org: "Organización Internacional del Trabajo"
    url: "https://www.ilo.org/publications/future-work-emerging-sectors-and-potential-transition-formality"
    pdf: "/assets/pdf/ilo-future-of-work-formality.pdf"
    text: >-
      De dónde podrían salir nuevos empleos formales en la economía verde, la economía de
      plataformas y la economía del cuidado, y qué haría falta para que además fueran decentes.
