policy:
  - title: "Informalidad laboral en Costa Rica"
    year: "2025–26"
    org: "Organización Internacional del Trabajo, de próxima publicación"
    text: >-
      Un diagnóstico del empleo informal, escrito para alimentar el marco nacional de
      formalización. Sistematiza una década de estudios y normativa, sigue cómo se movió el empleo
      informal por dimensiones demográficas y territoriales con microdatos de encuestas de hogares,
      y modela sus determinantes estructurales. Las recomendaciones siguen la Recomendación 204 de
      la OIT y la estrategia FORLAC 2.0.
