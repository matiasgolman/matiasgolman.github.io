working:
  - title: "Inteligencia artificial y rasgos de personalidad"
    sub: "Evidencia de avisos de empleo online"
    authors: "con María García-Vega"
    where: "GEP Research Paper 2026/06, Universidad de Nottingham"
    year: 2026
    pdf: "/assets/pdf/golman-ai-personality-traits.pdf"
    text: >-
      Cuando una empresa empieza a contratar perfiles de IA, ¿también empieza a buscar otro tipo de
      persona? Leímos 11,7 millones de avisos británicos para averiguarlo, y la respuesta es que
      sí. Las empresas que se meten en IA piden apertura a la experiencia en todas sus búsquedas,
      no sólo en las técnicas.
    abstract: >-
      A partir del análisis de texto de 11,7 millones de avisos de empleo online publicados en el
      Reino Unido entre 2017 y 2022, construimos medidas de los cinco grandes rasgos de
      personalidad y de los requisitos de habilidades vinculadas a la IA. A nivel de aviso, los
      puestos que piden habilidades de IA tienen una probabilidad significativamente mayor de
      demandar apertura a la experiencia, y menor de demandar los otros cuatro rasgos, una vez
      controlados los efectos fijos de empresa, ocupación, localidad y tiempo. El patrón se
      distingue del de los avisos que piden habilidades informáticas generales, lo que sugiere que
      la asociación con la apertura es propia del conocimiento de IA y no de los requisitos
      digitales en sentido amplio. A nivel de empresa, estimaciones de diferencias en diferencias
      escalonadas muestran que cuando una empresa amplía su contratación en IA, su demanda de
      apertura sube en todos sus avisos, incluidos los que no son de IA dentro del mismo grupo
      ocupacional.

  - title: "El valor de la personalidad"
    sub: "La paradoja de la penalización salarial en el Reino Unido"
    where: "Universidad de Nottingham"
    year: 2026
    pdf: "/assets/pdf/golman-value-of-personality.pdf"
    text: >-
      Los avisos que piden rasgos de personalidad pagan en promedio 4,6% menos. Si esos rasgos
      están penalizados, ¿por qué pedirlos? Pongo a prueba cuatro explicaciones contra 11,7
      millones de avisos británicos, y ninguna da cuenta de toda la brecha por sí sola.
    abstract: >-
      Los puestos que mencionan rasgos de personalidad ofrecen salarios 4,6% más bajos en promedio,
      lo que plantea una paradoja. ¿Por qué buscar rasgos que se penalizan? Con 11,7 millones de
      avisos británicos (2017 a 2022) pongo a prueba cuatro explicaciones: correlación con
      características de puestos mal pagos, diferencias compensatorias, intensidad del lenguaje y
      segmentación demográfica. Los efectos fijos de ocupación absorben la mayor parte, pero quedan
      penalizaciones significativas. Son mayores en ocupaciones de alta calificación, menores en
      roles feminizados, y crecen con fuerza según la intensidad del lenguaje empleado.

  - title: "La efectividad de las políticas de formalización en América Latina"
    sub: "Un meta-análisis de 79 evaluaciones de impacto"
    year: 2026
    authors: "con Verónica Escudero y Elva López-Mourelo"
    where: "Organización Internacional del Trabajo"
    pdf: "/assets/pdf/golman-formalisation-meta-analysis.pdf"
    text: >-
      Treinta años de intentos de llevar trabajadores latinoamericanos al empleo formal, reunidos
      en un mismo lugar y comparados entre sí. La mayoría funciona. Cuáles funcionan mejor, y por
      cuánto tiempo, depende de qué es lo que uno quiere mover.
    abstract: >-
      El primer meta-análisis integral de políticas de formalización en América Latina, con 79
      evaluaciones de impacto, 527 estimaciones e intervenciones entre 1990 y 2020, incluyendo
      estudios en castellano e informes de gobierno no publicados que las revisiones anteriores no
      habían recogido. Las políticas de formalización funcionan en su mayoría y los efectos
      adversos son raros (5,1% de las estimaciones), aunque el sesgo de publicación reduce
      sustancialmente los tamaños de efecto una vez corregido. Las políticas activas de empleo, las
      campañas de información y la inspección laboral aumentan la formalidad. Los programas de
      protección social con componentes de activación producen los mayores efectos sobre ingresos
      pero casi no mueven la formalidad. Los beneficios se fortalecen con el tiempo y las
      intervenciones de componentes múltiples superan a las de componente único.

