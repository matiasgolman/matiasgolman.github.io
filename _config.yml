title: "Matías Golman"
tagline: "Labour economist"
description: >-
  Matías Golman is a labour economist at Utrecht University and a consultant for
  the ILO, the OECD and the World Bank. He works on informal employment, skills
  and labour market policy in Latin America and Europe.
url: "https://matiasgolman.github.io"
baseurl: ""
lang: "en"

author:
  name: "Matías Golman"
  email: "matias.golman@gmail.com"
  job_title: "Lecturer in Applied Economics"
  affiliation: "Utrecht University"
  affiliation_url: "https://www.uu.nl/staff/MAGolman"
  location: "Utrecht, the Netherlands"

# Profiles used for links and for the Person structured data (sameAs)
profiles:
  - name: "Google Scholar"
    url: "https://scholar.google.com/citations?user=mcC8FQwAAAAJ"
  - name: "ORCID"
    url: "https://orcid.org/0000-0001-6557-963X"
  - name: "LinkedIn"
    url: "https://www.linkedin.com/in/matiasgolman/"
  - name: "GitHub"
    url: "https://github.com/matiasgolman"
  - name: "Utrecht University"
    url: "https://www.uu.nl/staff/MAGolman"
  - name: "Instagram"
    url: "https://www.instagram.com/gol.mat/"

google_site_verification: "4v_RtVj-MRC238cDUQl3VPdihKXF3uZXfXrp2WzUf_k"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
permalink: /notes/:year/:title/
markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: ["apos", "apos", "quot", "quot"]
sass:
  style: compressed
  sass_dir: _sass

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: /feed.xml
  collections:
    posts:
      path: /feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - _pipeline/
  - vendor/
  - node_modules/

defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: "post" }
