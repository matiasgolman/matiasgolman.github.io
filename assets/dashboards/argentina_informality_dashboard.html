<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Panel de informalidad en Argentina · Matías Golman</title>
<link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<script src="../js/plotly-basic-2.35.2.min.js" charset="utf-8"></script>
<style>
/* ============================================================
   Argentina informality dashboard
   Design tokens mirror matiasgolman.github.io (assets/css/main.scss)
   ============================================================ */
@font-face{font-family:Literata;src:url("../fonts/literata-latin-400-normal.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Literata;src:url("../fonts/literata-latin-600-normal.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Plex Sans";src:url("../fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Plex Sans";src:url("../fonts/ibm-plex-sans-latin-500-normal.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Plex Sans";src:url("../fonts/ibm-plex-sans-latin-600-normal.woff2") format("woff2");font-weight:600;font-display:swap}

:root{
  --paper:#111613; --paper-2:#1a211d; --paper-3:#212a25;
  --ink:#e6ede6; --ink-soft:#9daba2; --ink-dim:#71807730;
  --green:#7cc2a0; --green-deep:#a5d9be; --rule:#2a332e;
  --grid:#222b26;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --m0:#294333; --m1:#2f553f; --m2:#35694b; --m3:#3b7d58;
  --m4:#409165; --m5:#44a772; --m6:#49bc80;
  --serif:Literata,Charter,Georgia,serif;
  --sans:"Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fs-s:.8125rem; --fs-0:.9375rem; --fs-1:1.0625rem; --fs-2:1.3rem;
}
:root[data-theme="light"]{
  --paper:#f6f8f4; --paper-2:#eaefe7; --paper-3:#e1e8dd;
  --ink:#16211b; --ink-soft:#4e5d55; --ink-dim:#4e5d5530;
  --green:#1f5d45; --green-deep:#123c2c; --rule:#d4ddd2;
  --grid:#dde4da;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --m0:#d1efdc; --m1:#b2dbc1; --m2:#92c8a6; --m3:#6fb18a;
  --m4:#48996c; --m5:#0d804e; --m6:#006831;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--serif);font-size:var(--fs-0);line-height:1.6;
  text-rendering:optimizeLegibility;
  padding:0 0 2rem;
}
body.is-embedded{padding-top:0;padding-bottom:0}
.wrap{width:min(100% - 2rem,76rem);margin-inline:auto}
/* embedded, the host page already provides the gutter: align our edges to its text */
body.is-embedded .wrap{width:100%}

/* --- masthead (standalone only) --- */
.bar{border-bottom:1px solid var(--rule);margin-bottom:1.6rem}
body.is-embedded .bar{display:none}
.bar__in{display:flex;flex-wrap:wrap;gap:.6rem 1.4rem;align-items:baseline;
  justify-content:space-between;padding:1.2rem 0}
.bar__title{font-family:var(--serif);font-weight:600;font-size:var(--fs-2);
  margin:0;letter-spacing:-.015em}
.bar__sub{font-family:var(--sans);font-size:var(--fs-s);color:var(--ink-soft);margin:.15rem 0 0}

/* --- generic controls --- */
.seg{display:inline-flex;border:1px solid var(--rule);background:var(--paper-2)}
.seg button{font-family:var(--sans);font-size:var(--fs-s);color:var(--ink-soft);
  background:none;border:0;padding:.3rem .7rem;cursor:pointer;line-height:1.5}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--paper-3);color:var(--ink);font-weight:500}
.seg button:hover{color:var(--green)}

/* --- section frame --- */
.sect{margin-top:2.4rem}
.sect__head{display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:baseline;
  justify-content:space-between;border-top:2px solid var(--ink);padding-top:.7rem;margin-bottom:1.1rem}
.sect__title{font-family:var(--serif);font-size:var(--fs-1);font-weight:600;margin:0;letter-spacing:-.01em}
.sect__note{font-family:var(--sans);font-size:var(--fs-s);color:var(--ink-soft);margin:0}

/* --- KPI strip --- */
.ovbtn{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--sans);font-size:var(--fs-s);
  font-weight:500;color:var(--green);background:var(--paper);border:1.5px solid var(--green);
  padding:.38rem .8rem;cursor:pointer;line-height:1.3;white-space:nowrap}
.ovbtn:hover{background:var(--paper-3)}
.ovbtn__sw{width:1.4rem;border-top:2px dotted currentColor}
.ovbtn[aria-pressed="true"]{background:var(--green);color:var(--paper)}
.ovbtn[aria-pressed="true"] .ovbtn__sw{border-top-style:dotted}
.ovbtn:disabled{opacity:.45;cursor:not-allowed}
.meth{font-family:var(--sans);font-size:var(--fs-s);color:var(--ink-soft);margin:-.4rem 0 .9rem}
.meas{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;padding:.2rem 0 1rem;
  font-family:var(--sans);font-size:var(--fs-s);color:var(--ink-soft)}
.meas__lab{font-size:.7rem;font-weight:500;text-transform:uppercase;letter-spacing:.055em}
.meas__note{max-width:62ch;margin:0}
.kpi__delta + .kpi__delta{margin-top:.1rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));
  gap:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.kpi{padding:.95rem 1.1rem .95rem 0;border-left:1px solid var(--rule);padding-left:1.1rem}
.kpi:first-child{border-left:0;padding-left:0}
.kpi__label{font-family:var(--sans);font-size:var(--fs-s);color:var(--ink-soft);
  margin:0 0 .3rem;letter-spacing:.005em}
.kpi__val{font-family:var(--sans);font-size:1.75rem;font-weight:600;line-height:1.05;
  margin:0;letter-spacing:-.02em}
.kpi__delta{font-family:var(--sans);font-size:var(--fs-s);color:var(--ink-soft);margin:.3rem 0 0}
.kpi__delta b{font-weight:500;font-variant-numeric:tabular-nums}
.kpi--lead .kpi__val{font-size:2.3rem}

/* --- control panel --- */
.panel{border:1px solid var(--rule);background:var(--paper-2)}
.controls{display:flex;flex-wrap:wrap;gap:.85rem 1.1rem;padding:.95rem 1.1rem;
  border-bottom:1px solid var(--rule)}
.controls--sub{background:transparent}
.ctl{display:flex;flex-direction:column;gap:.25rem;min-width:0}
.ctl>label{font-family:var(--sans);font-size:.7rem;font-weight:500;
  color:var(--ink-soft);text-transform:uppercase;letter-spacing:.055em}
.ctl select{font-family:var(--sans);font-size:var(--fs-s);color:var(--ink);
  background:var(--paper);border:1px solid var(--rule);padding:.34rem 1.7rem .34rem .5rem;
  cursor:pointer;max-width:15rem;border-radius:0;
  appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.ctl select:hover{border-color:var(--green)}
.ctl select:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.ctl--years{flex-direction:row;align-items:flex-end;gap:.4rem}
.ctl--years .yr{display:flex;flex-direction:column;gap:.25rem}
.ctl--years span.dash{color:var(--ink-soft);padding-bottom:.42rem;font-family:var(--sans)}
.ctl--act{margin-left:auto;justify-content:flex-end}
.btn{font-family:var(--sans);font-size:var(--fs-s);color:var(--ink-soft);
  background:var(--paper);border:1px solid var(--rule);padding:.34rem .7rem;cursor:pointer}
.btn:hover{color:var(--green);border-color:var(--green)}

/* --- series chips --- */
.series{padding:.8rem 1.1rem;border-bottom:1px solid var(--rule)}
.series[hidden]{display:none}
.series__head{display:flex;flex-wrap:wrap;gap:.5rem .8rem;align-items:baseline;margin-bottom:.55rem}
.series__lab{font-family:var(--sans);font-size:.7rem;font-weight:500;color:var(--ink-soft);
  text-transform:uppercase;letter-spacing:.055em}
.series__acts{display:flex;gap:.45rem;margin-left:auto}
.series__acts button{font-family:var(--sans);font-size:var(--fs-s);color:var(--ink-soft);
  background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;
  text-underline-offset:.15em;text-decoration-color:var(--ink-dim)}
.series__acts button:hover{color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{display:inline-flex;align-items:center;gap:.42rem;font-family:var(--sans);
  font-size:var(--fs-s);color:var(--ink-soft);background:var(--paper);
  border:1px solid var(--rule);padding:.26rem .6rem;cursor:pointer;line-height:1.45;
  max-width:22rem;text-align:left}
.chip:hover{border-color:var(--green);color:var(--ink)}
.chip__sw{width:.6rem;height:.6rem;flex:0 0 auto;background:var(--ink-dim);border-radius:50%}
.chip[aria-pressed="true"]{color:var(--ink);background:var(--paper-3);border-color:var(--rule)}
.chip__txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* --- chart --- */
.plot-head{display:flex;flex-wrap:wrap;gap:.3rem 1rem;align-items:baseline;
  justify-content:space-between;padding:.9rem 1.1rem .1rem}
.plot-title{font-family:var(--serif);font-size:var(--fs-1);font-weight:600;margin:0;
  letter-spacing:-.01em;max-width:60ch}
.plot-sub{font-family:var(--sans);font-size:var(--fs-s);color:var(--ink-soft);margin:.1rem 0 0}
.plot{padding:.2rem .4rem .6rem;position:relative;min-height:18rem}
.plot-foot{display:flex;flex-wrap:wrap;gap:.5rem .7rem;align-items:center;
  padding:0 1.1rem 1rem}
.warn{font-family:var(--sans);font-size:var(--fs-s);color:var(--ink-soft);
  border-left:2px solid var(--s4);padding:.3rem 0 .3rem .7rem;margin:0 1.1rem 1rem;max-width:68ch}
.warn[hidden]{display:none}
.plotmsg{font-family:var(--sans);font-size:var(--fs-s);color:var(--ink-soft);
  text-align:center;padding:2.6rem 1rem;margin:0}
.plotmsg[hidden]{display:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;
  background:color-mix(in srgb,var(--paper-2) 78%,transparent);z-index:5;
  font-family:var(--sans);font-size:var(--fs-s);color:var(--ink-soft)}
.loading[hidden]{display:none}
.spin{width:1rem;height:1rem;border:2px solid var(--ink-dim);border-top-color:var(--green);
  border-radius:50%;animation:sp .7s linear infinite;margin:0 auto .5rem}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}

/* --- split: sector + map --- */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.6rem}
@media (max-width:62rem){.split{grid-template-columns:1fr}}
.card{border:1px solid var(--rule);background:var(--paper-2);min-width:0}
.card__head{padding:.9rem 1.1rem .15rem}
.card__title{font-family:var(--serif);font-size:var(--fs-1);font-weight:600;margin:0;letter-spacing:-.01em}
.card__sub{font-family:var(--sans);font-size:var(--fs-s);color:var(--ink-soft);margin:.15rem 0 0}
.card__body{padding:.3rem .4rem .8rem;position:relative;min-height:16rem}

/* hand-drawn map */
.mapbox{display:flex;flex-direction:column;align-items:center}
.mapsvg{width:100%;max-width:17rem;height:auto;display:block;overflow:visible}
.mapsvg path{transition:fill .12s ease, stroke .12s ease}
.mapsvg path:hover,.mapsvg path:focus{stroke:var(--ink);stroke-width:1.4;outline:none}
@media (prefers-reduced-motion:reduce){.mapsvg path{transition:none}}
.maphint{font-family:var(--sans);font-size:var(--fs-s);color:var(--ink-soft);
  margin:.5rem 0 0;min-height:1.2em;text-align:center}
.maphint b{color:var(--ink);font-weight:500}

/* map scale legend */
.scale{display:flex;align-items:center;gap:.5rem;padding:0 1.1rem 1rem;
  font-family:var(--sans);font-size:var(--fs-s);color:var(--ink-soft)}
.scale__bar{display:flex;flex:1;height:.52rem;min-width:5rem}
.scale__bar i{flex:1}

/* --- notes --- */
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:0 2rem}
details.note{border-top:1px solid var(--rule);padding:.7rem 0}
details.note summary{font-family:var(--sans);font-size:var(--fs-s);color:var(--green);
  cursor:pointer;list-style:none;font-weight:500}
details.note summary::-webkit-details-marker{display:none}
details.note summary::before{content:"+ ";font-weight:600}
details.note[open] summary::before{content:"– "}
.note__body{font-size:var(--fs-s);line-height:1.62;color:var(--ink-soft);
  margin:.6rem 0 0;max-width:62ch}
.note__body strong{color:var(--ink);font-weight:600}

/* --- attribution --- */
.attrib{font-family:var(--sans);font-size:var(--fs-s);color:var(--ink-soft);
  border-top:1px solid var(--rule);margin-top:2.2rem;padding-top:1rem;max-width:68ch}
.attrib a{color:var(--green);text-decoration:underline;text-underline-offset:.16em;
  text-decoration-color:var(--ink-dim)}
.attrib a:hover{text-decoration-color:currentColor}

/* --- table view (accessibility relief for low-contrast light hues) --- */
.tablewrap{padding:0 1.1rem 1.1rem;overflow-x:auto}
.tablewrap[hidden]{display:none}
table.data{border-collapse:collapse;font-family:var(--sans);font-size:var(--fs-s);
  width:100%;color:var(--ink)}
table.data th,table.data td{border-bottom:1px solid var(--rule);padding:.3rem .55rem;
  text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.data th:first-child,table.data td:first-child{text-align:left;font-variant-numeric:normal}
table.data thead th{color:var(--ink-soft);font-weight:500;position:sticky;top:0;background:var(--paper-2)}
table.data .sw{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;margin-right:.4rem}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:46rem){
  .controls{gap:.7rem .8rem}
  .ctl select{max-width:11rem}
  .kpi__val{font-size:1.45rem}
  .kpi--lead .kpi__val{font-size:1.8rem}
  /* two fixed columns, so the separators can follow the grid instead of the
     source order (a border-left on every item leaves stray rules when it wraps) */
  .kpis{grid-template-columns:1fr 1fr}
  .kpi{border-left:0;padding-left:0;border-top:1px solid var(--rule)}
  .kpi:nth-child(even){border-left:1px solid var(--rule);padding-left:1.1rem}
  .kpi:nth-child(-n+2){border-top:0}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="bar">
    <div class="bar__in">
      <div>
        <h1 class="bar__title" data-t="title">Panel de informalidad en Argentina</h1>
        <p class="bar__sub" id="subtitle">INDEC · Encuesta Permanente de Hogares</p>
      </div>
      <div style="display:flex;gap:.6rem;align-items:center">
        <div class="seg" role="group" aria-label="Language">
          <button type="button" data-lang="es" aria-pressed="true">ES</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <div class="seg" role="group" aria-label="Theme">
          <button type="button" data-theme-set="dark"  aria-pressed="false">●</button>
          <button type="button" data-theme-set="light" aria-pressed="false">○</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== KPI strip ===== -->
  <section aria-labelledby="kpiH">
    <div class="sect__head" style="border-top:0;padding-top:0">
      <h2 class="sect__title" id="kpiH" data-t="kpi_title">Indicadores principales</h2>
      <p class="sect__note" data-t="kpi_note" id="kpiNote"></p>
    </div>
    <p class="meth" data-t="kpi_meth"></p>
    <div class="kpis" id="kpis"></div>
  </section>

  <!-- ===== Interactive analysis ===== -->
  <section class="sect" aria-labelledby="iaH">
    <div class="sect__head">
      <h2 class="sect__title" id="iaH" data-t="interactive_title">Análisis interactivo</h2>
      <p class="sect__note" data-t="how_it_works_text"></p>
    </div>

    <div class="panel">
      <div class="controls">
        <div class="ctl">
          <label for="fMetric" data-t="metric">Métrica</label>
          <select id="fMetric"></select>
        </div>
        <div class="ctl">
          <label for="fParam" data-t="parameter">Desagregar por</label>
          <select id="fParam"></select>
        </div>
        <div class="ctl">
          <label for="fType" data-t="chart_type">Gráfico</label>
          <select id="fType"></select>
        </div>
        <div class="ctl ctl--years">
          <div class="yr"><label for="fFrom" data-t="from_year">Desde</label><select id="fFrom"></select></div>
          <span class="dash">–</span>
          <div class="yr"><label for="fTo" data-t="to_year">Hasta</label><select id="fTo"></select></div>
        </div>
      </div>

      <div class="controls controls--sub">
        <div class="ctl"><label for="fGender" data-t="gender">Género</label><select id="fGender"></select></div>
        <div class="ctl"><label for="fRegion" data-t="region">Región</label><select id="fRegion"></select></div>
        <div class="ctl"><label for="fAge" data-t="age">Edad</label><select id="fAge"></select></div>
        <div class="ctl"><label for="fEmp" data-t="emp_category">Categoría ocupacional</label><select id="fEmp"></select></div>
        <div class="ctl ctl--act">
          <button class="btn" id="btnReset" data-t="reset_filters" type="button">Reiniciar</button>
        </div>
      </div>

      <div class="series" id="seriesBox" hidden>
        <div class="series__head">
          <span class="series__lab" id="seriesLab" data-t="select_values">Series</span>
          <span class="series__acts">
            <button type="button" id="btnAll"  data-t="select_all">Todas</button>
            <button type="button" id="btnNone" data-t="deselect_all">Ninguna</button>
          </span>
        </div>
        <div class="chips" id="chips"></div>
      </div>

      <div class="plot-head">
        <div>
          <h3 class="plot-title" id="plotTitle"></h3>
          <p class="plot-sub" id="plotSub"></p>
        </div>
        <button type="button" class="ovbtn" id="btnOver" aria-pressed="false">
          <span class="ovbtn__sw" aria-hidden="true"></span><span id="btnOverTxt"></span></button>
      </div>
      <p class="warn" id="warnBox" hidden></p>
      <p class="plotmsg" id="mainMsg" hidden></p>
      <div class="plot"><div id="mainChart"></div>
        <div class="loading" id="mainLoad"><div><div class="spin"></div><span data-t="loading">Cargando…</span></div></div>
      </div>
      <div class="plot-foot">
        <button class="btn" id="btnTable" type="button" data-t="show_table">Ver tabla</button>
        <button class="btn" id="btnCsv"   type="button" data-t="download_data">Descargar datos (CSV)</button>
        <button class="btn" id="btnPng"   type="button" data-t="download_chart">Descargar gráfico (PNG)</button>
      </div>
      <div class="tablewrap" id="tableWrap" hidden></div>
    </div>
  </section>

  <!-- ===== Sector + map ===== -->
  <section class="sect" aria-labelledby="geoH">
    <div class="sect__head">
      <h2 class="sect__title" id="geoH" data-t="landscape_title">Dónde se concentra la informalidad</h2>
      <div style="display:flex;gap:.8rem;align-items:center;flex-wrap:wrap">
        <p class="sect__note" id="geoYear"></p>
        <div class="seg" role="group" aria-label="View" id="viewSeg">
          <button type="button" data-view="level" aria-pressed="true" data-t="view_level">Nivel</button>
          <button type="button" data-view="change" aria-pressed="false" data-t="view_change">Cambio interanual</button>
        </div>
      </div>
    </div>
    <div class="split">
      <div class="card">
        <div class="card__head">
          <h3 class="card__title" data-t="sector_title">Por sector</h3>
          <p class="card__sub" id="sectorSub"></p>
        </div>
        <div class="card__body"><div id="sectorChart"></div>
          <div class="loading" id="sectorLoad"><div><div class="spin"></div><span data-t="loading">Cargando…</span></div></div>
        </div>
      </div>
      <div class="card">
        <div class="card__head">
          <h3 class="card__title" data-t="map_title">Por provincia</h3>
          <p class="card__sub" id="mapSub"></p>
        </div>
        <div class="card__body"><div id="mapChart"></div>
          <div class="loading" id="mapLoad"><div><div class="spin"></div><span data-t="loading">Cargando…</span></div></div>
        </div>
        <div class="scale">
          <span id="scaleLo">—</span>
          <span class="scale__bar" id="scaleBar"></span>
          <span id="scaleHi">—</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== Notes ===== -->
  <section class="sect" aria-labelledby="nH">
    <div class="sect__head">
      <h2 class="sect__title" id="nH" data-t="data_notes">Notas</h2>
    </div>
    <div class="notes">
      <details class="note">
        <summary data-t="informality_info">Definición de informalidad</summary>

/* CSV shard -> {n, cols:{name:[...]}}. Every value is numeric; an empty cell
   (e.g. formal hours in a cell with no formal workers) becomes null. */
function parseCsv(txt){
  const lines = txt.replace(/\r/g,"").split("\n").filter(l=>l.length);
  const head = lines[0].split(",").map(h=>h.replace(/"/g,"").trim());
  const cols = {}; head.forEach(h=>cols[h]=new Array(lines.length-1));
  for(let i=1;i<lines.length;i++){
    const f = lines[i].split(",");
    for(let j=0;j<head.length;j++){
      const v = f[j];
      cols[head[j]][i-1] = (v===undefined || v==="" || v===".") ? null
        : (isNaN(+v) ? v.replace(/"/g,"") : +v);
    }
  }
  return {n:lines.length-1, cols};
}
function loadMeta(){
  if(!meta) meta = fetch(DATA_DIR+"meta.json")

    .catch(err=>{ meta = null; throw err; });
  return meta;
}
function load(name){
  if(!shards[name]) shards[name] = fetch(DATA_DIR+name+".csv")
    .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status+" for "+name); return r.text(); })
    .then(parseCsv)
    .catch(err=>{ delete shards[name]; throw err; });   // a failed load must stay retryable
  return shards[name];
}
let snap = null;

}

/** Return row indices of `sh` where every key of `fixed` matches. */
function select(sh, fixed){
  const c = sh.cols, n = sh.n, ks = Object.keys(fixed), out = [];
  for(let i=0;i<n;i++){
    let ok = true;
    for(let k=0;k<ks.length;k++){ if(c[ks[k]][i] !== fixed[ks[k]]){ ok=false; break; } }
    if(ok) out.push(i);
  }
  return out;
}

/* Plotly.react cannot morph a scatter trace into a bar, nor a single plot into
   a subplot grid: it keeps the old rendering. Purge whenever the *form* changes
   and react only for same-shape data updates, which stays cheap. */
function reactOrRedraw(div, traces, layout, sig){
  if(sig !== lastForm){ Plotly.purge(div); lastForm = sig; }
  Plotly.react(div, traces, layout, PLOT_CFG);
}

/* Year ticks that never collide. `maxLabels` is driven by the width the axis
   actually gets, so a narrow small-multiples panel gets far fewer than a
   full-width plot. The last year is always labelled. */
function yearAxis(years, maxLabels){
  const first = years[0], last = years[years.length-1], span = last-first+1;
  const cap = maxLabels || 12;
  let step = Math.ceil(span/cap);
  [1,2,5,10,20].some(c=>{ if(c>=step){ step=c; return true; } return false; });
  const vals = [];
  for(let y=first; y<=last; y+=step) vals.push(y);
  if(vals[vals.length-1] !== last){
    if(last - vals[vals.length-1] < step/2) vals.pop();
    vals.push(last);
  }
  return {tickmode:"array", tickvals:vals, ticktext:vals.map(String), tickangle:0};
}

/* ---------- KPI strip ---------- */
const qName = (y,q) => lang==="es" ? `${q}.º trim. ${y}` : `Q${q} ${y}`;
async function renderKpis(){
  const sh = await load("trimestral");
  const c = sh.cols;
  const cards = [
    {lab:{es:"Total",en:"Total"},             f:{g:99,e:99,c:99}, lead:true},
    {lab:{es:"Mujeres",en:"Women"},           f:{g:0,e:99,c:99}},
    {lab:{es:"Varones",en:"Men"},             f:{g:1,e:99,c:99}},
    {lab:{es:"Hasta 24 años",en:"Up to 24"},  f:{g:99,e:1,c:99}},
    {lab:{es:"25–44 años",en:"Aged 25–44"},   f:{g:99,e:2,c:99}}
  ];
  let latest = null;
  const vals = cards.map(cd=>{
    const idx = select(sh, Object.assign({v:meas}, cd.f));
    const byQ = {};
    idx.forEach(i=>{ byQ[c.y[i]*10+c.q[i]] = c.t[i]; });
    const ks = Object.keys(byQ).map(Number).sort((a,b)=>a-b);
    const k1 = ks[ks.length-1];
    if(latest==null || k1>latest) latest = k1;
    const prevQ = ks.length>1 ? ks[ks.length-2] : null;
    return {cd, v:byQ[k1], pq: prevQ!=null ? byQ[prevQ] : null, py: byQ[k1-10]};
  });
  const delta = (v,p,lab) => {
    if(v==null || p==null) return "";
    const d = v-p, arrow = d>0.05 ? "▲" : d<-0.05 ? "▼" : "▪";
    return `<p class="kpi__delta">${arrow} <b>${d>0?"+":""}${d.toFixed(1)} ${t("pp")}</b> ${lab}</p>`;
  };
  $("#kpis").innerHTML = vals.map(({cd,v,pq,py})=>`<div class="kpi${cd.lead?" kpi--lead":""}">
      <p class="kpi__label">${cd.lab[lang]}</p>
      <p class="kpi__val">${v==null?"–":v.toFixed(1)+"%"}</p>${delta(v,pq,t("vs_prev_q"))}${delta(v,py,t("vs_year_ago"))}</div>`).join("");
  if(latest!=null) $("#kpiNote").textContent = t("latest_q") + ": " + qName(Math.floor(latest/10), latest%10);
  return latest;
}

    to:     +$("#fTo").value,
    g:+$("#fGender").value, r:+$("#fRegion").value,
    e:+$("#fAge").value,    c:+$("#fEmp").value
  };
}
async function rowsForSelection(s, m){
  if(m===undefined) m = CHART_V;
  const cols = METRIC_COLS[s.metric];
  if(s.param==="all"){
    const sh = await load("base");
    const idx = select(sh,{v:m,g:s.g,r:s.r,e:s.e,c:s.c});
    return {sh, idx, brkCol:null, cols};
  }
  const name = PARAM_SHARD[s.param], col = PARAM_COL[s.param];
  const sh = await load(name);
  const fixed = {g:s.g,r:s.r,e:s.e,c:s.c};
  delete fixed[col];
  fixed.v = m;                       // the dimension being broken down runs free
  const idx = select(sh, fixed).filter(i=> sh.cols[col][i] !== 99);
  return {sh, idx, brkCol:col, cols};
}
/** group rows -> {key -> {year -> [v1,v2]}} */
function pivot(sh, idx, brkCol, cols, from, to){
  const c = sh.cols, out = new Map(); let lowSample = false;
  for(const i of idx){
    const y = c.y[i];
    if(y<from || y>to) continue;
    const key = brkCol==null ? "_" : c[brkCol][i];
    if(!out.has(key)) out.set(key,{});
    out.get(key)[y] = cols.map(k=>c[k][i]);
    if(c.o[i]===1) lowSample = true;
  }
  return {groups:out, lowSample};
}

/* Colour follows the entity, not its rank: a slot is held until that entity is
   deselected, so removing one series never repaints the survivors. */
const slots = {};                       // param -> Map(entity -> slot index)
function syncSlots(param, sel){
  if(!slots[param]) slots[param] = new Map();
  const m = slots[param];
  for(const k of Array.from(m.keys())) if(!sel.has(k)) m.delete(k);
  const taken = new Set(m.values());
  for(const k of sel){
    if(m.has(k)) continue;
    let s = 0; while(taken.has(s) && s < 8) s++;
    if(s < 8){ m.set(k, s); taken.add(s); }
  }
  return m;
}
function slotColor(param, k){
  const m = slots[param]; if(!m || !m.has(k)) return null;
  return seriesColors()[m.get(k)];
}
function ensureSelection(param, keys){
  if(!picked[param]) picked[param] = new Set(keys.slice(0, keys.length>8?5:keys.length));
  syncSlots(param, picked[param]);
  return picked[param];
}
/* `colored` is false whenever the chart does not encode these entities by hue
   (small multiples), so a chip never advertises a colour the plot doesn't use. */
function buildChips(param, keys, colored){
  const box = $("#seriesBox");
  if(param==="all"){ box.hidden = true; return; }
  box.hidden = false;
  $("#seriesLab").textContent = PARAMS[param][lang];
  const col = PARAM_COL[param];
  const labs = L[col][lang];
  const sel = picked[param];
  const ordered = keys.slice();
  const colorOf = k => (colored && sel.size<=8) ? slotColor(param,k) : null;
  $("#chips").innerHTML = ordered.map(k=>{
    const on = sel.has(k), col2 = colorOf(k);
    return `<button class="chip" type="button" aria-pressed="${on}" data-k="${k}">
      <span class="chip__sw" style="${on&&col2?`background:${col2}`:""}"></span>
      <span class="chip__txt">${labs[k]||k}</span></button>`;
  }).join("");
  $$("#chips .chip").forEach(b=>b.addEventListener("click",()=>{
    const k = isNaN(+b.dataset.k) ? b.dataset.k : +b.dataset.k;
    sel.has(k) ? sel.delete(k) : sel.add(k);
    render();
  }));
}

function showMsg(text){

async function render(){
  const s = currentSel();

  $("#mainLoad").hidden = false;
  try{
    const {sh, idx, brkCol, cols} = await rowsForSelection(s);
    const {groups, lowSample} = pivot(sh, idx, brkCol, cols, s.from, s.to);
    /* Long series + rate: overlay the new INDEC methodology wherever it exists,
       as a dotted line in the same colour, instead of splicing the two. */
    let over = null;
    const canOver = s.metric==="tasa_informalidad" && s.type!=="bar";
    const bo = $("#btnOver");
    bo.disabled = !canOver; bo.title = canOver ? "" : t("over_na");
    bo.setAttribute("aria-pressed", String(showOver && canOver));

    if(showOver && canOver){
      const o = await rowsForSelection(s, 1);
      over = pivot(o.sh, o.idx, o.brkCol, o.cols, s.from, s.to).groups;
      if(!Array.from(over.values()).some(g=>Object.keys(g).length)) over = null;
    }
    let keys = Array.from(groups.keys());
    if(brkCol) keys.sort((a,b)=>a-b);

      showMsg(brkCol ? t("pick_one") : t("no_data"));
      $("#warnBox").hidden = true; $("#mainLoad").hidden = true; lastRows=null; return;
    }
    showMsg(null);

    const years = []; for(let y=s.from;y<=s.to;y++) years.push(y);
    const dual  = cols.length===2;
    const colors = seriesColors();
    const labs   = brkCol ? L[brkCol][lang] : null;

    // Decide the form first: one plot, or small multiples. Chips follow it.
    const useSmall = s.type==="small" || (brkCol && (keys.length>8 || (dual && keys.length>1)));
    if(brkCol) buildChips(s.param, allKeys, !useSmall);

    const overAt = k => { if(!over) return null; const g = over.get(k);
      if(!g || !Object.keys(g).length) return null;
      return years.map(y=> g[y] ? g[y][0] : null); };
    const ovName = t("overlay_name");

    lastRows = {s, keys, years, cols, labs, groups};

    if(!useSmall){
      const traces = [];
      keys.forEach((k,ki)=>{
        const arrs = seriesAt(k);
        arrs.forEach((vals,ci)=>{
          const color = brkCol ? (slotColor(s.param,k) || colors[ki%8]) : colors[ci];
          const nm = (brkCol ? (labs[k]||k) : "") +

          } : {

          });
        });
        const ov = overAt(k);
        if(ov){
          const color = brkCol ? (slotColor(s.param,k) || colors[ki%8]) : colors[0];
          const nm = (brkCol ? (labs[k]||k)+" · " : "") + ovName;
          traces.push({type:"scatter", mode:"lines+markers", x:years, y:ov, name:nm,
            line:{color, width:2, dash:"dot"}, marker:{color, size:6}, connectgaps:false,
            showlegend: !brkCol,
            hovertemplate:`<b>${nm}</b><br>%{x}: %{y:.1f}<extra></extra>`});
        }
      });
      // with a breakdown, one legend key explains the dotted style for all series
      if(over && brkCol) traces.push({type:"scatter", mode:"lines+markers", x:[null], y:[null],
        name:ovName, line:{color:css("--ink-soft"), width:2, dash:"dot"},
        marker:{color:css("--ink-soft"), size:6}, hoverinfo:"skip"});
      const lay = baseLayout({
        height: 420,
        xaxis: Object.assign(baseLayout().xaxis, yearAxis(years), {title:{text:t("year"),font:{size:11,color:css("--ink-soft")}}}),
        yaxis: Object.assign(baseLayout().yaxis, {title:{text:axisTitle(s.metric),font:{size:11,color:css("--ink-soft")},standoff:12}}),
        showlegend: traces.length>1,
        legend:{orientation:"h", yanchor:"bottom", y:1.02, xanchor:"left", x:0,
                font:{size:11,color:css("--ink-soft")}, itemsizing:"constant"},
        barmode:"group", bargap:0.25, bargroupgap:0.08,
        hovermode: s.type==="bar" ? "closest" : "x unified"

      reactOrRedraw("mainChart", traces, lay, "flat|"+s.type+"|"+traces.length);
    } else {
      // small multiples: one panel per series, shared y scale
      const panels = keys.length;
      const ncol = panels<=2?panels: panels<=6?3:4;
      const nrow = Math.ceil(panels/ncol);
      let lo=Infinity, hi=-Infinity;
      keys.forEach(k=>seriesAt(k).concat(overAt(k)?[overAt(k)]:[]).forEach(a=>a.forEach(v=>{ if(v!=null){ lo=Math.min(lo,v); hi=Math.max(hi,v);} })));
      if(!isFinite(lo)){ lo=0; hi=1; }
      const pad = (hi-lo)*0.12 || 1;

      const traces=[], anns=[], lay={};

        const row = Math.floor(ki/ncol), col = ki%ncol;
        anns.push({text:(labs?(labs[k]||k):""), xref:"x"+ax+" domain", yref:"y"+ax+" domain",
          x:0, y:1.05, showarrow:false, xanchor:"left", yanchor:"bottom",

        lay["xaxis"+ax] = Object.assign({}, baseLayout().xaxis, tick,

      reactOrRedraw("mainChart", traces, baseLayout(Object.assign({
        grid:{rows:nrow, columns:ncol, pattern:"independent", xgap:0.09, ygap:0.34},

      }, lay)), "small|"+nrow+"x"+ncol+"|"+traces.length);
    }
    if($("#tableWrap").hidden===false) drawTable();
  }catch(err){
    console.error(err);
    Plotly.purge("mainChart"); lastForm = "";

/* ---------- table / CSV ---------- */
function tableRows(){
  if(!lastRows) return null;
  const {s,keys,years,cols,labs,groups} = lastRows;
  const head = [t("year")];
  keys.forEach(k=>{
    const base = labs ? (labs[k]||k) : METRICS[s.metric][lang];
    if(cols.length===2){ head.push(base+" · "+t("informal")); head.push(base+" · "+t("formal")); }
    else head.push(base);
  });
  const body = years.map(y=>{
    const row = [y];
    keys.forEach(k=>{ const g = groups.get(k)||{};
      cols.forEach((_,ci)=> row.push(g[y]?g[y][ci]:null)); });
    return row;
  });
  return {head, body, metric:s.metric, keys, labs};
}
function drawTable(){
  const d = tableRows(); if(!d) return;
  const colors = seriesColors();
  const sw = i => `<span class="sw" style="background:${colors[Math.floor(i/(d.head.length-1>d.keys.length?2:1))%8]}"></span>`;
  $("#tableWrap").innerHTML = `<table class="data"><thead><tr>${
    d.head.map((h,i)=>`<th>${i===0?h:sw(i-1)+h}</th>`).join("")}</tr></thead><tbody>${
    d.body.map(r=>`<tr>${r.map((v,i)=>`<td>${i===0?v:fmt(v,d.metric)}</td>`).join("")}</tr>`).join("")
  }</tbody></table>`;
}
function downloadCsv(){
  const d = tableRows(); if(!d) return;
  const esc = v => v==null ? "" : (/[",\n;]/.test(String(v)) ? '"'+String(v).replace(/"/g,'""')+'"' : v);
  const csv = [d.head.map(esc).join(","), ...d.body.map(r=>r.map(esc).join(","))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"}));
  a.download = "informalidad_argentina.csv"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

/* ---------- snapshot helpers ----------
   snapshot.csv holds, for each measure, the two latest complete years of the
   rate by sector (k="s") and province (k="p"), with no other filter. */
async function snapRows(kind){
  const sh = await loadSnap(), c = sh.cols;
  const idx = []; for(let i=0;i<sh.n;i++) if(c.k[i]===kind && c.v[i]===meas) idx.push(i);
  const y1 = Math.max.apply(null, idx.map(i=>c.y[i]));
  const cur = {}, prev = {};
  idx.forEach(i=>{ if(c.y[i]===y1) cur[c.id[i]] = c.t[i]; else if(c.y[i]===y1-1) prev[c.id[i]] = c.t[i]; });
  const rows = Object.keys(cur).map(Number).map(id=>({k:id,
    v: geoView==="level" ? cur[id] : (prev[id]==null ? null : +(cur[id]-prev[id]).toFixed(1))}))
    .filter(r=>r.v!=null);
  return {year:y1, rows, hasPrev:Object.keys(prev).length>0};
}

/* ---------- province choropleth (hand-drawn SVG) ----------
   Plotly's geo bundle carries no bar trace, so the map is drawn directly:
   a Mercator projection over 24 polygons, themed from the same CSS tokens. */
const deacc = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
/* Both axes must end up in the SAME unit (radians) or the fit collapses. */
const mercX = lon => lon * Math.PI/180;
const mercY = lat => {
  const r = Math.max(-85, Math.min(85, lat)) * Math.PI/180;
  return -Math.log(Math.tan(Math.PI/4 + r/2));
};
function ringsOf(geom){
  return geom.type === "Polygon" ? geom.coordinates : geom.coordinates.flat();
}
async function renderMap(){
  $("#mapLoad").hidden = false;
  try{
    const [sn, gj] = await Promise.all([snapRows("p"), loadGeo()]);
    const byCode = {};
    sn.rows.forEach(r=>{ byCode[r.k] = r.v; });
    const chg = geoView==="change";
    const fmtV = v => (chg && v>0 ? "+" : "") + v.toFixed(1) + (chg ? " pp" : "%");

    // province code -> feature, matched on a de-accented name
    const featBy = {};
    gj.features.forEach(f=>{
      featBy[deacc(f.properties.name)] = f;
      if(f.properties.kpi) featBy[deacc(f.properties.kpi)] = f;
    });
    const items = [];
    Object.keys(byCode).forEach(code=>{
      const nm = PROV[code]; if(!nm) return;
      const f = featBy[deacc(nm)];
      if(f) items.push({f, name:nm, v:byCode[code]});
    });
    if(!items.length) throw new Error("no map matches");

    // fit all drawn geometry to the viewBox
    let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
    items.forEach(it=>ringsOf(it.f.geometry).forEach(r=>r.forEach(pt=>{
      const x = mercX(pt[0]), y = mercY(pt[1]);
      if(x<x0)x0=x; if(x>x1)x1=x;
      if(y<y0)y0=y; if(y>y1)y1=y;
    })));
    const H = 660, PAD = 8;
    const sc = (H-2*PAD)/(y1-y0);                 // height-driven: Argentina is tall
    const W = Math.ceil((x1-x0)*sc) + 2*PAD;
    const ox = PAD, oy = PAD;
    const px = lon => ox + (mercX(lon)-x0)*sc;
    const py = lat => oy + (mercY(lat)-y0)*sc;
    const pathOf = geom => ringsOf(geom).map(r=>
      r.map((pt,i)=>(i?"L":"M")+px(pt[0]).toFixed(1)+" "+py(pt[1]).toFixed(1)).join("")+"Z"
    ).join("");

    const vals = items.map(it=>it.v);
    let lo = Math.min.apply(null,vals), hi = Math.max.apply(null,vals);
    let ramp = mapRamp();
    if(chg){
      // diverging, symmetric around zero: blue = informality fell, orange = rose
      const m = Math.max(Math.abs(lo), Math.abs(hi)) || 1; lo = -m; hi = m;
      const mix = (hex, a) => { const n = parseInt(hex.slice(1),16);
        return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; };
      const b = css("--s1"), o = css("--s2");
      ramp = [mix(b,.95),mix(b,.65),mix(b,.35),css("--paper-3"),mix(o,.35),mix(o,.65),mix(o,.95)];
    }
    const bucket = v => ramp[Math.max(0, Math.min(ramp.length-1,
      Math.floor(((v-lo)/((hi-lo)||1)) * ramp.length)))];
    const surface = css("--paper-2");

    items.sort((a,b)=>a.v-b.v);
    const paths = items.map((it,i)=>
      `<path d="${pathOf(it.f.geometry)}" fill="${bucket(it.v)}" stroke="${surface}"
         stroke-width="0.8" stroke-linejoin="round" tabindex="0" role="listitem"
         data-n="${it.name.replace(/"/g,'&quot;')}" data-v="${fmtV(it.v)}"
         aria-label="${it.name}: ${fmtV(it.v)}"><title>${it.name}: ${fmtV(it.v)}</title></path>`
    ).join("");

    $("#mapChart").innerHTML =
      `<div class="mapbox"><svg viewBox="0 0 ${W} ${H}" class="mapsvg" role="list"
            aria-label="${t("map_title")}" preserveAspectRatio="xMidYMid meet">${paths}</svg>
       <p class="maphint" id="mapHint">&nbsp;</p></div>`;

    const hint = $("#mapHint");
    const show = e => { const el=e.target.closest("path"); if(!el) return;
      hint.innerHTML = `<b>${el.dataset.n}</b> · ${el.dataset.v}`; };
    const clear = () => { hint.innerHTML = "&nbsp;"; };
    const svg = $("#mapChart svg");
    svg.addEventListener("mousemove", show);
    svg.addEventListener("mouseleave", clear);
    svg.addEventListener("focusin", show);
    svg.addEventListener("focusout", clear);

    $("#scaleBar").innerHTML = ramp.map(h=>`<i style="background:${h}"></i>`).join("");
    $("#scaleLo").textContent = fmtV(lo);
    $("#scaleHi").textContent = fmtV(hi);
    $("#mapSub").textContent = geoSub(sn.year);
  }catch(e){ console.error(e); }
  finally{ $("#mapLoad").hidden = true; postHeight(); }
}

/* ---------- i18n + controls ---------- */
function fillSelect(el, entries, value){
  el.innerHTML = entries.map(([v,label])=>`<option value="${v}">${label}</option>`).join("");
  if(value!==undefined) el.value = String(value);
}
function buildControls(keepValues){
  const keep = keepValues ? currentSel() : null;
  const dictEntries = (d) => Object.keys(d).map(k=>[k, d[k][lang]]);
  fillSelect($("#fMetric"), dictEntries(METRICS), keep?keep.metric:"tasa_informalidad");
  fillSelect($("#fParam"),  dictEntries(PARAMS),  keep?keep.param:"all");
  fillSelect($("#fType"),   dictEntries(CHARTS),  keep?keep.type:"line");
  const opts = (col) => Object.keys(L[col][lang]).map(Number).sort((a,b)=>a-b)
      .map(v=>[v, L[col][lang][v]]);
  fillSelect($("#fGender"), opts("g"), keep?keep.g:99);
  fillSelect($("#fRegion"), opts("r"), keep?keep.r:99);
  fillSelect($("#fAge"),    opts("e"), keep?keep.e:99);
  fillSelect($("#fEmp"),    opts("c"), keep?keep.c:99);
}
function applyI18n(){
  document.documentElement.lang = lang;
  $$("[data-t]").forEach(el=>{
    const k = el.dataset.t, v = t(k);
    if(!v) return;
    if(/<[a-z]/i.test(v)) el.innerHTML = v; else el.textContent = v;
  });
  $("#attrib").innerHTML = t("attrib");
  setSubtitle();
  $("#btnTable").textContent = $("#tableWrap").hidden ? t("show_table") : t("hide_table");
  $$("[data-lang]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.lang===lang)));
  document.title = t("title")+" · Matías Golman";
}
function setTheme(th, quiet){
  if(th==="light" || th==="dark") document.documentElement.setAttribute("data-theme", th);
  else document.documentElement.removeAttribute("data-theme");
  $$("[data-theme-set]").forEach(b=>b.setAttribute("aria-pressed",
    String(b.dataset.themeSet === (document.documentElement.getAttribute("data-theme")||""))));
  if(!quiet) redrawAll();
}
function redrawAll(){ lastForm = ""; render(); renderSector(); renderMap(); renderKpis(); }
/* Annual years available for the current measure, read from meta.json. */
function yearsFor(m){
  if(!window._meta) return [2003];
  const y0 = window._meta.primer_anio[String(m)], y1 = window._meta.ultimo_anio, out=[];
  for(let y=y0;y<=y1;y++) out.push(y);
  return out;
}
function fillYears(reset){
  const ys = yearsFor(CHART_V);
  const keepF = +$("#fFrom").value, keepT = +$("#fTo").value;
  fillSelect($("#fFrom"), ys.map(y=>[y,y]), ys[0]);
  fillSelect($("#fTo"),   ys.map(y=>[y,y]), ys[ys.length-1]);
  if(!reset && ys.includes(keepF)) $("#fFrom").value = keepF;
  if(!reset && ys.includes(keepT)) $("#fTo").value = keepT;
  // two or three annual points read better as bars than as a line
  if(reset) $("#fType").value = ys.length<=3 ? "bar" : "line";
}
function setSubtitle(){
  const md = window._meta; if(!md) return;
  $("#subtitle").textContent = t("subtitle") + " · " + md.primer_anio["2"] + "–" + md.ultimo_trimestre.y;
  baseLab = qName(md.base_deflactor.y, md.base_deflactor.q);
}

/* ---------- embed plumbing ---------- */
let lastH = 0;
function postHeight(){
  if(!embedded) return;
  requestAnimationFrame(()=>{
    const h = Math.ceil(document.documentElement.scrollHeight);
    if(Math.abs(h-lastH) < 4) return;
    lastH = h;
    try{ parent.postMessage({type:"dashboard:height", id:"informality", height:h}, "*"); }catch(e){}
  });
}
window.addEventListener("message", ev=>{
  const d = ev.data;
  if(!d || typeof d !== "object") return;
  if(d.type==="dashboard:theme") setTheme(d.theme);
  if(d.type==="dashboard:lang" && (d.lang==="es"||d.lang==="en")){ lang=d.lang; relang(); }
});
function relang(){
  buildControls(true); applyI18n(); picked = {}; redrawAll();
}

/* ---------- init ---------- */
(function init(){
  if(embedded) document.body.classList.add("is-embedded");
  const q = new URLSearchParams(location.search);
  if(q.get("lang")==="en"||q.get("lang")==="es") lang = q.get("lang");
  else if((document.referrer||"").includes("/es/")) lang = "es";
  if(q.get("theme")) setTheme(q.get("theme"), true);
  else {
    $$("[data-theme-set]").forEach(b=>b.setAttribute("aria-pressed","false"));
  }

  buildControls(false);
  applyI18n();

  ["fMetric","fType","fFrom","fTo","fGender","fRegion","fAge","fEmp"]
    .forEach(id=>$("#"+id).addEventListener("change", render));
  $("#fParam").addEventListener("change", ()=>{ render(); });
  $("#btnReset").addEventListener("click", ()=>{
    picked = {}; buildControls(false); fillYears(true); render();
  });
  $("#btnAll").addEventListener("click", ()=>{
    const p = $("#fParam").value; if(p==="all") return;
    const col = PARAM_COL[p];
    picked[p] = new Set(Object.keys(L[col][lang]).map(Number).filter(v=>v!==99));
    render();
  });
  $("#btnNone").addEventListener("click", ()=>{
    const p = $("#fParam").value; if(p==="all") return;
    picked[p] = new Set(); render();
  });
  $("#btnTable").addEventListener("click", ()=>{
    const w = $("#tableWrap"); w.hidden = !w.hidden;
    $("#btnTable").textContent = w.hidden ? t("show_table") : t("hide_table");
    if(!w.hidden) drawTable();
    postHeight();
  });
  $("#btnCsv").addEventListener("click", downloadCsv);
  $("#btnPng").addEventListener("click", ()=>{
    Plotly.downloadImage("mainChart", {format:"png", scale:2, width:1200, height:560,
      filename:"informalidad_argentina"});
  });
  $$("[data-lang]").forEach(b=>b.addEventListener("click", ()=>{ lang=b.dataset.lang; relang(); }));
  $$("[data-theme-set]").forEach(b=>b.addEventListener("click", ()=>setTheme(b.dataset.themeSet)));

  window.addEventListener("resize", postHeight);
  if(window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);

  $("#btnOver").addEventListener("click", ()=>{ showOver = !showOver; render(); });
  $$("[data-view]").forEach(b=>b.addEventListener("click", ()=>{
    geoView = b.dataset.view;
    $$("[data-view]").forEach(x=>x.setAttribute("aria-pressed", String(x.dataset.view===geoView)));
    renderSector(); renderMap();
  }));

  loadMeta().then(md=>{ window._meta = md; })
    .catch(e=>console.error(e))
    .finally(()=>{ setSubtitle(); fillYears(true); applyI18n();
      renderKpis(); render(); renderSector(); renderMap(); });
})();
</script>
</body>
</html>
