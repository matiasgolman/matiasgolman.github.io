{%- assign lang = page.lang | default: site.lang -%}{%- assign L = site.data.i18n[lang] -%}
{%- assign other = page.alt_url | default: L.other_home -%}
<header class="masthead">
  <div class="frame masthead__in">
    <a class="wordmark" href="{{ L.home | relative_url }}">Matías Golman</a>
    <nav class="nav" aria-label="{{ L.code | upcase }}">
      {%- for item in L.nav %}
      <a href="{{ item.url | relative_url }}"{% if page.url contains item.match %} aria-current="page"{% endif %}>{{ item.label }}</a>
      {%- endfor %}
      <span class="nav__sep" aria-hidden="true"></span>
      <a class="nav__lang" href="{{ other | relative_url }}" hreflang="{{ L.other_code }}" lang="{{ L.other_code }}">{{ L.other_label }}</a>
      <button class="themer" type="button" data-theme-toggle
              data-label-dark="{{ L.theme_to_dark }}" data-label-light="{{ L.theme_to_light }}"
              aria-label="{{ L.theme_aria }}">{{ L.theme_to_light }}</button>
    </nav>
  </div>
</header>
